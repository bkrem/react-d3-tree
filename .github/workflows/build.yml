name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]
        react-version: [18, 19]

    name: node ${{ matrix.node-version }}, react ${{ matrix.react-version }}

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Install pnpm and Node.js ${{ matrix.node-version }}
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      # The lockfile holds React 19. The React 18 leg swaps the dev copy and its types after the
      # frozen install; the smoke test's consumer follows through REACT_MAJOR.
      - name: Use React 18
        if: matrix.react-version == 18
        run: pnpm add -D react@18.3.1 react-dom@18.3.1 @types/react@18 @types/react-dom@18

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm fmt:check
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm test
      - run: pnpm test:smoke
        env:
          REACT_MAJOR: ${{ matrix.react-version }}
